apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17.9-bookworm
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: POSTGRES_PASSWORD}}
            - name: PORTAL_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: PORTAL_DB_PASSWORD}}
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: KEYCLOAK_DB_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 2Gi}
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            initialDelaySeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: init
          configMap: {name: postgres-init, defaultMode: 365}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: {requests: {storage: 20Gi}}
